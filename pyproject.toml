[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deteccion-fraude"
version = "1.0.0"
description = "Detección de fraude financiero con detección de anomalías no supervisada (Isolation Forest y Autoencoder) y alertas con supervisión humana"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.scripts]
detectar-fraude = "deteccion_fraude.main:main"

[tool.setuptools.packages.find]
include = ["deteccion_fraude*"]
